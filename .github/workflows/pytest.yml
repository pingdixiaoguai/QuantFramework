name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests must use mocks/fixtures; no production credentials are present.
      TUSHARE_TOKEN: ""
      DINGTALK_WEBHOOK: ""
      DINGTALK_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --locked
      - name: Run full test suite offline
        run: uv run pytest
