experiment:
  id: momentum_defender_universal_anchor_gold_exception_v1
  created_on: "2026-08-25"
  evidence_status: preregistered_retrospective_occam_staged_search_not_oos
  hypothesis: >-
    Preserve the 510300 regime gate for non-Gold Momentum assets and allow a
    Gold-specific DRAQM signal to override it only while Gold is Top-1.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  momentum_assets: [510300.SH, 159915.SZ, 513100.SH, 518880.SH]
  universal_anchor_asset: 510300.SH
  gold_exception_asset: 518880.SH
  defender: relative_defender_rotation_2013_listing_aware
  other_overlays: disabled

extreme_block_trim:
  shock_return_window: 5
  normalization_mode: raw_absolute_log_return
  block_length_sessions: 20
  excluded_block_fraction: 0.10
  candidate_independent: true
  final_metrics_include_all_dates: true

factor_defaults:
  formula: downside_regularized_raqm
  volatility_floor_annual: 0.08
  winsor_limit: 3.0
  percentile_history: rolling_504_strict_lag
  percentile_min_history: 252

anchor_policy_grid:
  profiles:
    w40: {horizons: [40], weights: [1.0]}
    w20_40_25_75: {horizons: [20, 40], weights: [0.25, 0.75]}
    w30_40_25_75: {horizons: [30, 40], weights: [0.25, 0.75]}
    w30_40_equal: {horizons: [30, 40], weights: [0.50, 0.50]}
  entry_percentiles: [0.45, 0.55, 0.65]
  recovery_percentiles: [0.10, 0.20, 0.30]
  minimum_hysteresis_gap: 0.10
  entry_confirmation_days: [1, 3]
  recovery_confirmation_days: [1]
  fixed_stage_locks: [25, 25]
  policies_per_profile:
    best_full: 1
    best_trimmed: 1
    best_combined: 1

gold_policy_grid:
  profiles:
    w20: {horizons: [20], weights: [1.0]}
    w40: {horizons: [40], weights: [1.0]}
    w20_40_25_75: {horizons: [20, 40], weights: [0.25, 0.75]}
    w30_40_25_75: {horizons: [30, 40], weights: [0.25, 0.75]}
    w30_40_equal: {horizons: [30, 40], weights: [0.50, 0.50]}
  entry_percentiles: [0.20, 0.30, 0.40, 0.50, 0.60]
  recovery_percentiles: [0.00, 0.10, 0.20]
  minimum_hysteresis_gap: 0.10
  entry_confirmation_days: [1, 3, 5]
  recovery_confirmation_days: [1, 3]
  override_modes: [gold_exemption_only, gold_bidirectional]
  fixed_stage_locks: [25, 25]
  pairs_per_anchor_profile_and_gold_profile:
    best_full: 1
    best_trimmed: 1
    best_combined: 1

joint_stage:
  momentum_lock_days: [0, 5, 10, 15, 20, 25, 30]
  defender_lock_days: [0, 5, 10, 15, 20, 25, 30]
  locks_must_be_nonnegative_multiples_of_five: true
  minimum_defender_entries: 3
  minimum_defender_days: 40
  minimum_segment_sharpe: 0.0

selection_including_extremes:
  ranking_fields:
    - full_annualized_return_252
    - full_sharpe
    - full_minimum_segment_sharpe
    - lock_neighborhood_full_annualized_q25
    - lock_neighborhood_full_sharpe_q25
  occam_annualized_tolerance: 0.005
  occam_sharpe_tolerance: 0.02

selection_excluding_extremes:
  ranking_fields:
    - trimmed_annualized_return_252
    - trimmed_sharpe
    - trimmed_minimum_segment_sharpe
    - lock_neighborhood_trimmed_annualized_q25
    - lock_neighborhood_trimmed_sharpe_q25
  occam_annualized_tolerance: 0.005
  occam_sharpe_tolerance: 0.02

occam_complexity:
  single_window_profile: 0
  weighted_profile: 1
  gold_exemption_only: 0
  gold_bidirectional: 1
  extra_confirmation_day_unit: 0.01

forced_controls:
  anchor:
    profile_id: w30_40_25_75
    entry_percentile: 0.55
    recovery_percentile: 0.20
    entry_confirmation_days: 3
    recovery_confirmation_days: 1
  gold:
    profile_id: w30_40_equal
    entry_percentile: 0.20
    recovery_percentile: 0.10
    entry_confirmation_days: 5
    recovery_confirmation_days: 1
  override_modes: [gold_exemption_only, gold_bidirectional]

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260825
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
