experiment:
  id: gold_raqm_regularization_robust_search_v2
  created_on: "2026-08-24"
  evidence_status: preregistered_retrospective_cross_base_search_not_oos
  objective: >-
    Find the simplest Gold RAQM override that remains useful under both the
    current formal C2 state and the absolute-stability research state, with
    explicit preference for removing volatility-floor and winsor parameters.

fixed:
  gold_asset: 518880.SH
  defender_curve: whole_continuous_hold_net_nav
  hard_min_gold_hold_days: 5
  signal_timing: previous_close_to_next_open
  return_convention: log_return
  efficiency_ratio_convention: log_path
  base_states:
    - formal_log_qm_v2
    - absolute_stability_candidate_v1

factor_grid:
  windows: [3, 5, 10, 20, 40, 60]
  regularization_families:
    raw:
      volatility_floors_annual: [null]
      winsor_limits: [null]
      extra_numeric_parameters: 0
    floor_only:
      volatility_floors_annual: [0.04, 0.08, 0.12]
      winsor_limits: [null]
      extra_numeric_parameters: 1
    winsor_only:
      volatility_floors_annual: [null]
      winsor_limits: [2.0, 3.0, 4.0]
      extra_numeric_parameters: 1
    floor_and_winsor:
      volatility_floors_annual: [0.04, 0.08, 0.12]
      winsor_limits: [2.0, 3.0, 4.0]
      extra_numeric_parameters: 2

threshold_grid:
  entry_differences: [0.0, 0.25, 0.50, 0.75, 1.0, 1.5, 2.0, 2.2, 2.5, 3.0, 4.0]
  exit_differences: [-1.0, -0.5, 0.0, 0.25, 0.50, 0.60, 0.75, 1.0, 1.5, 2.0]
  require_exit_not_above_entry: true

periods:
  full: ["2019-01-18", "2026-08-21"]
  calendar_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

selection:
  minimum_gold_entries_each_base: 5
  full_annualized_delta_floor_each_base: 0.0
  full_sharpe_delta_floor_each_base: 0.0
  full_mdd_delta_floor_each_base: -0.01
  leave_year_annualized_delta_q25_floor: -0.02
  leave_year_annualized_delta_median_floor: 0.0
  leave_year_sharpe_delta_q25_floor: -0.10
  leave_year_sharpe_delta_median_floor: 0.0
  primary_rule: >-
    Select the minimum-parameter family among candidates passing every gate on
    both base states; within that family maximize the worst-base robust metric
    percentile, then mean percentile.
  parameter_count:
    always_present: [window, entry_difference, exit_difference]
    removable: [volatility_floor_annual, winsor_limit]

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260824
  leave_one_event: true
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  prefer_raw_family_if_robust: true
  deleted_periods_are_stress_tests_only: true
