experiment:
  id: momentum_defender_w40_occam_position_v1
  created_on: "2026-08-25"
  evidence_status: preregistered_retrospective_fixed_w40_gate_not_oos
  hypothesis: >-
    With the formal W40 gate and a fixed monthly 40-day reversal selector, a
    low-dimensional dividend/bond exposure rule can retain or improve the
    composite annualized return and Sharpe of the legacy champion core.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  top_gate_strategy_id: momentum_defender_w40_loss_excluding_extremes_v1
  gate_window: 40
  gate_entry_percentile: 0.55
  gate_recovery_percentile: 0.40
  gate_entry_confirmation_days: 1
  gate_recovery_confirmation_days: 1
  gate_momentum_lock_days: 30
  gate_defender_lock_days: 30
  defender_selector: monthly_lowest_40_day_log_return
  defender_selector_window: 40
  defender_equity_assets:
    - 512890.SH
    - 159545.SZ
    - 513530.SH
    - 515080.SH
    - 510880.SH
    - 563020.SH
  defensive_asset: 511260.SH
  position_anchor_asset: 512890.SH

position_families:
  frozen_champion:
    enabled: true
  fixed_weight:
    weights: [0.00, 0.25, 0.50, 0.75, 1.00]
  trend_binary:
    signal_sources: [anchor, selected]
    windows: [20, 40, 60, 120]
  range_location:
    formula: one_minus_rolling_range_location
    signal_sources: [anchor, selected]
    windows: [20, 40, 60, 120]
  volatility_target:
    formula: min_one_target_over_close_volatility
    signal_sources: [anchor, selected]
    windows: [20]
    annual_targets: [0.12, 0.18, 0.24, 0.30, 0.40]
  relative_volatility_cap:
    formula: min_one_strict_lag_rolling_504_vol_quantile_over_current_vol
    signal_sources: [anchor, selected]
    windows: [20]
    quantiles: [0.50, 0.80]
  drawdown_scale:
    formula: clip_negative_rolling_drawdown_over_scale_zero_one
    signal_sources: [anchor, selected]
    windows: [40, 120]
    drawdown_scales: [0.05, 0.10, 0.20]

extreme_block_trim:
  shock_assets: [510300.SH, 518880.SH]
  shock_return_window: 5
  block_length_sessions: 20
  excluded_block_fraction: 0.10
  normalization_mode: raw_absolute_log_return

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]

eligibility:
  maximum_full_drawdown: -0.30
  minimum_full_segment_sharpe: 1.20
  minimum_ordinary_segment_sharpe: 1.35

joint_occam_selection:
  full_annualized_tolerance: 0.01
  full_sharpe_tolerance: 0.03
  ordinary_annualized_tolerance: 0.01
  ordinary_sharpe_tolerance: 0.05
  rule: >-
    Find candidates near the joint four-metric performance leader, minimize
    fitted parameter count, then maximize the minimum neighborhood and segment
    Sharpe before point estimates.

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260825
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  latest_w40_gate_parameters_must_not_be_refit: true

