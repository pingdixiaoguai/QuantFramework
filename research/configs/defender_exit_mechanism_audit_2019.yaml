experiment:
  id: defender_exit_mechanism_audit_2019_v1
  created_on: "2026-08-26"
  evidence_status: preregistered_retrospective_2019_restart_not_oos
  hypothesis: >-
    The hard 30-session Defender lock may be replaced by a low-dimensional
    recovery rule that permits strong, persistent recoveries to exit earlier
    while retaining the existing 30-session rule as a fallback.
  evaluation_start: "2019-01-18"
  evidence_cutoff: "2026-08-26"
  baseline_strategy_id: momentum_defender_w40_gold_qm20_escape_v3
  expected_formal_return_hash: ac13f9d1ace712939dd92575218e0626f55eb3129ee3e22478e1f76d5fb4355c

frozen_layers:
  momentum_factor: quality_momentum
  momentum_window: 20
  momentum_rebalance_days: 5
  w40_window: 40
  w40_percentile_history: 504
  w40_percentile_min_history: 252
  defender_entry_percentile: 0.55
  defender_entry_confirmation_days: 1
  momentum_lock_days: 30
  defender_monthly_selector: return_lowest_w40
  defender_assets:
    - 512890.SH
    - 513530.SH
    - 515080.SH
    - 510880.SH
    - 515450.SH
    - 513630.SH
  gold_entry_x: 0.005
  gold_exit_y: -0.020
  gold_hard_hold_days: 5
  immediate_gold_entry_veto: true
  recovery_percentile: 0.40
  fallback_defender_lock_days: 30

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-26"]
  complete_pool: ["2024-02-06", "2026-08-26"]

candidate_families:
  fixed_lock:
    lock_days: [0, 5, 10, 15, 20, 25, 30, 35, 40, 50, 60, 90]
    recovery_confirmation_days: 1
  confirmed_early_exit:
    minimum_lock_days: [5, 10]
    recovery_confirmation_days: [2, 3, 5, 10]
    fallback_to_current_at_day: 30
  strong_recovery_early_exit:
    minimum_lock_days: 5
    strong_recovery_percentiles: [0.00, 0.10, 0.20, 0.30]
    recovery_confirmation_days: [1, 3, 5]
    fallback_to_current_at_day: 30
  linear_recovery_early_exit:
    minimum_lock_days: 5
    initial_recovery_percentiles: [0.00, 0.10, 0.20, 0.30]
    final_recovery_percentile: 0.40
    final_day: 30
    recovery_confirmation_days: [1, 3, 5]
    fallback_to_current_at_day: 30

selection:
  require_full_annualized_above_baseline: true
  require_full_sharpe_above_baseline: true
  require_mdd_not_worse: true
  prefer_all_segments_noninferior: true
  do_not_combine_post_hoc_winners: true

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260826
  rolling_windows: [252, 504]
  transaction_cost_multipliers: [1.0, 3.0, 10.0]

signed_recovery_followup:
  evidence_status: post_clipped_score_diagnosis_retrospective_not_oos
  minimum_lock_days: 5
  fallback_to_current_at_day: 30
  anchor_signed_log_return:
    horizons: [10, 20, 40, 60]
    threshold: 0.0
    confirmation_days: [1, 3, 5, 10]
  top1_minus_defender_qm20:
    threshold: 0.0
    confirmation_days: [1, 3, 5, 10]
  anchor20_and_relative_qm:
    confirmation_days: [1, 3, 5]

decision:
  no_automatic_production_replacement: true
  require_independent_forward_evidence_for_parameter_change: true
