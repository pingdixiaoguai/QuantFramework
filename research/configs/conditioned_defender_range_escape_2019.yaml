experiment:
  id: conditioned_defender_range_escape_2019_v1
  created_on: "2026-08-27"
  evidence_status: retrospective_development_validation_search_not_independent_oos
  evaluation_start: "2019-01-18"
  evidence_cutoff: "2026-08-26"
  baseline_strategy_id: momentum_defender_w40_qm40_threshold_v5
  hypothesis: >-
    A partial Momentum escape may become useful if a high-range Defender signal
    is admitted only when the current formal Momentum Top-1 has acceptable
    quality momentum and the Momentum tranche is hard-held for several days.

frozen_layers:
  formal_strategy: momentum_defender_w40_qm40_threshold_v5
  formal_w40_qm40_and_gold: unchanged
  defender_selector: monthly_lowest_qm40
  momentum_top1: frozen_formal_schedule
  execution_timing: previous_close_to_next_open
  equity_etf_one_way_cost: 0.0001

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-26"]
  complete_pool: ["2024-02-06", "2026-08-26"]

stage1_structure:
  range_window: 40
  upper_threshold: 0.95
  quality_window: 20
  anchor_modes: [fixed_512890, selected_defender]
  momentum_weights: [0.10, 0.20, 0.30]
  hold_policies: [minimum_until_fail, fixed_pulse_rearm]
  hold_days: [3, 5, 7]
  include_no_gate: true
  absolute_floors: [-0.010, 0.000, 0.005, 0.010, 0.020]
  relative_floors: [-0.010, 0.000, 0.005, 0.010, 0.020]
  joint_absolute_floors: [0.000, 0.005, 0.010]
  joint_relative_floors: [0.000, 0.005, 0.010]

development_selection:
  minimum_escape_entries: 5
  maximum_development_mdd_worsening: 0.01
  seed_group_fields: [anchor_mode, hold_policy, gate_family]
  seeds_per_group: 1
  ranking_fields:
    - development_annualized_return_252
    - development_sharpe
    - development_max_drawdown
  selection_uses_validation: false

stage2_neighborhood:
  range_windows: [30, 40, 50]
  upper_thresholds: [0.90, 0.95, 1.00]
  quality_windows: [10, 20, 40]
  momentum_weights: [0.10, 0.20, 0.30]
  hold_days: [3, 5, 7]
  expansion: one_factor_plus_range_high_and_weight_hold_pairs
  gate_threshold_radius: 1

final_selection:
  require_development_dual_improvement: true
  require_validation_dual_improvement: true
  require_full_dual_improvement: true
  require_recent_dual_improvement: true
  maximum_mdd_worsening: 0.005
  minimum_escape_entries: 5
  minimum_one_factor_neighbor_full_dual_rate: 0.50
  minimum_one_factor_neighbor_validation_dual_rate: 0.50
  no_automatic_production_replacement: true

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260827
  rolling_windows: [252, 504]
  transaction_cost_multipliers: [1.0, 3.0, 10.0]
