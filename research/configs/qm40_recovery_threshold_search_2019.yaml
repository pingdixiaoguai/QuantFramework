experiment:
  id: qm40_recovery_threshold_search_2019_v1
  created_on: "2026-08-26"
  evidence_status: retrospective_threshold_search_with_disclosed_post_initial_ranking_correction_not_oos
  evaluation_start: "2019-01-18"
  evidence_cutoff: "2026-08-26"
  baseline_strategy_id: momentum_defender_w40_qm40_signed_exit_v4
  expected_baseline_return_hash: 80e979b8db7c430f1208ac2a3a671e7cf728e88f3f87c3186af25d1d1f1b3d91
  hypothesis: >-
    A non-zero absolute QM40 recovery threshold may use path efficiency
    magnitude, rather than sign alone, to improve the robustness of early
    Defender exits while all other v4 layers remain frozen.

frozen_layers:
  w40_history: 756
  w40_entry_percentile: 0.60
  w40_fallback_recovery_percentile: 0.35
  momentum_lock_days: 30
  defender_minimum_days: 5
  qm40_recovery_confirmation_days: 10
  defender_fallback_day: 30
  defender_selector: monthly_lowest_qm40
  gold_entry_x: 0.005
  gold_exit_y: -0.020
  gold_hard_hold_days: 5
  immediate_gold_entry_veto: true
  momentum_window: 20
  momentum_rebalance_days: 5
  execution_timing: previous_close_to_next_open

threshold_grid:
  values:
    - -0.01000
    - -0.00750
    - -0.00500
    - -0.00300
    - -0.00200
    - -0.00150
    - -0.00100
    - -0.00050
    - -0.00025
    - 0.00000
    - 0.00005
    - 0.00010
    - 0.00025
    - 0.00050
    - 0.00075
    - 0.00100
    - 0.00150
    - 0.00200
    - 0.00300
    - 0.00500
    - 0.00750
    - 0.01000
  comparison: strictly_greater
  baseline_threshold: 0.0

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-26"]
  complete_pool: ["2024-02-06", "2026-08-26"]

robust_selection:
  require_full_annualized_not_below_baseline: true
  require_full_sharpe_not_below_baseline: true
  maximum_mdd_worsening: 0.005
  maximum_minimum_segment_sharpe_drop: 0.05
  neighborhood_radius_in_grid_steps: 1
  ranking_fields:
    - full_annualized_return_252
    - full_sharpe
    - minimum_segment_sharpe
    - complete_pool_sharpe
    - neighborhood_annualized_q25
    - neighborhood_sharpe_q25
  score_aggregation: mean_percentile_rank
  tie_break: highest_neighborhood_then_plateau_center
  disclosed_revision: >-
    The initial minimum-rank aggregation was degenerate because complete-pool
    Sharpe was tied across many paths and selected a full-sample-inferior 0.002
    point. The final robust screen requires full annualized return and Sharpe
    not below the formal zero threshold, then uses mean percentile rank and
    selects the center of the dominant positive-threshold plateau.
  no_automatic_production_replacement: true

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260826
  rolling_windows: [252, 504]
  transaction_cost_multipliers: [1.0, 3.0, 10.0]
