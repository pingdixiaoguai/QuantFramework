experiment:
  id: momentum_defender_downside_raqm_weighted_profiles_v3
  created_on: "2026-08-24"
  evidence_status: post_v1_v2_weighted_profile_retrospective_search_not_oos
  predecessors:
    - momentum_defender_downside_raqm_v1
    - momentum_defender_downside_raqm_focused_stability_v2
  reason: >-
    V2 found a 30-40 day region but no candidate passed the preregistered
    cross-window 60% neighborhood gate, while 45-50 day single windows were
    weak. This separately versioned round tests a small set of fixed weighted
    30-50 day profiles to reduce dependence on one exact horizon.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  momentum_window: 20
  momentum_convention: log_return
  efficiency_ratio_convention: log_price_path
  defender: relative_defender_rotation_2013_listing_aware
  gold_override: disabled
  emergency_override: disabled

factor:
  anchor_asset: 510300.SH
  formula: downside_regularized_raqm
  volatility_floor_annual: 0.08
  winsor_limit: 3.0
  percentile_history_modes:
    rolling_504_strict_lag: 504
  percentile_min_history: 252
  profiles:
    w40: {horizons: [40], weights: [1.0]}
    w30_40_25_75: {horizons: [30, 40], weights: [0.25, 0.75]}
    w30_40_equal: {horizons: [30, 40], weights: [0.50, 0.50]}
    w35_40_25_75: {horizons: [35, 40], weights: [0.25, 0.75]}
    w35_40_equal: {horizons: [35, 40], weights: [0.50, 0.50]}
    w35_40_75_25: {horizons: [35, 40], weights: [0.75, 0.25]}
    w40_45_75_25: {horizons: [40, 45], weights: [0.75, 0.25]}
    w40_45_equal: {horizons: [40, 45], weights: [0.50, 0.50]}
    w30_40_50_center: {horizons: [30, 40, 50], weights: [0.25, 0.50, 0.25]}
    w30_40_50_equal: {horizons: [30, 40, 50], weights: [0.333, 0.334, 0.333]}
    w35_40_45_center: {horizons: [35, 40, 45], weights: [0.25, 0.50, 0.25]}
    w35_40_45_equal: {horizons: [35, 40, 45], weights: [0.333, 0.334, 0.333]}

state_search:
  defender_entry_percentiles: [0.55, 0.60, 0.65, 0.70]
  defender_exit_percentiles: [0.20, 0.30, 0.40, 0.50]
  minimum_hysteresis_gap: 0.10
  momentum_lock_days: [25, 27, 29, 30]
  defender_lock_days: [25, 27, 29, 30]
  defender_entry_confirmation_days: [1, 2, 3]
  momentum_recovery_confirmation_days: [1, 2, 3]
  initial_state: momentum

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]
  calendar_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

selection:
  hard_full_annualized_return_floor: 0.45
  minimum_defender_entries: 3
  minimum_defender_days: 60
  validation_annualized_return_floor: 0.25
  recent_annualized_return_floor: 0.25
  validation_sharpe_floor: 1.0
  recent_sharpe_floor: 1.0
  neighborhood_annualized_pass_rate_floor: 0.70
  neighborhood_include_adjacent_profiles: false
  neighborhood_definition: >-
    Same fixed weighted profile, history and confirmation counts; entry, exit,
    Momentum lock and Defender lock may each move by one adjacent grid step.
  rank_rule: >-
    Maximize within-profile neighborhood annualized pass rate, then
    neighborhood Sharpe q25, minimum segment Sharpe, and full Sharpe.

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260824
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  full_annualized_return_below_45pct_is_failure: true
  all_switch_features_must_have_horizon_at_least_20: true
  both_sleeve_locks_must_be_between_20_and_30_days: true
