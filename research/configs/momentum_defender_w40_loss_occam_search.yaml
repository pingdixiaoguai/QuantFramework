experiment:
  id: momentum_defender_w40_loss_occam_v1
  created_on: "2026-08-25"
  evidence_status: preregistered_retrospective_dual_objective_search_not_oos
  hypothesis: >-
    A single 40-day 510300 downside-log-loss percentile can retain most of the
    weighted DRAQM gate's robustness with materially fewer factor choices.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  momentum_assets: [510300.SH, 159915.SZ, 513100.SH, 518880.SH]
  defender: relative_defender_rotation_2013_listing_aware
  current_formal_daily: experiments/20260825_momentum_defender_downside_raqm_weighted_v1_formal/daily_backtest.parquet
  gold_overlay: disabled
  rapid_reversal: disabled
  emergency_override: disabled

factor:
  anchor_asset: 510300.SH
  formula: max_negative_40_day_log_return
  window: 40
  searchable_window: false
  path_efficiency: disabled
  volatility_adjustment: disabled
  volatility_floor: disabled
  winsor_clip: disabled
  percentile_history: rolling_504_strict_lag
  percentile_min_history: 252
  zero_loss_percentile: 0.0
  timing: previous_close_to_next_open

extreme_block_trim:
  shock_assets: [510300.SH, 518880.SH]
  shock_return_window: 5
  normalization_mode: raw_absolute_log_return
  block_length_sessions: 20
  excluded_block_fraction: 0.10
  candidate_independent: true
  used_for_parameter_selection_only: true
  final_metrics_include_all_dates: true

state_grid:
  entry_percentiles: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  recovery_percentiles: [0.10, 0.20, 0.30, 0.40]
  minimum_hysteresis_gap: 0.10
  entry_confirmation_days: [1, 3, 5]
  recovery_confirmation_days: [1, 3]
  momentum_lock_days: [20, 25, 30]
  defender_lock_days: [20, 25, 30]
  locks_must_be_five_day_multiples: true

eligibility:
  minimum_defender_entries: 3
  minimum_defender_days: 40
  minimum_full_segment_sharpe: 0.0
  minimum_ordinary_segment_sharpe: 0.0

selection_full_sample:
  ranking_fields:
    - full_annualized_return_252
    - full_sharpe
    - full_minimum_segment_sharpe
    - neighborhood_full_annualized_q25
    - neighborhood_full_sharpe_q25
  occam_annualized_tolerance: 0.005
  occam_sharpe_tolerance: 0.02

selection_excluding_extremes:
  ranking_fields:
    - ordinary_annualized_return_252
    - ordinary_sharpe
    - ordinary_minimum_segment_sharpe
    - neighborhood_ordinary_annualized_q25
    - neighborhood_ordinary_sharpe_q25
  occam_annualized_tolerance: 0.005
  occam_sharpe_tolerance: 0.02

occam_tiebreak:
  extra_confirmation_day_unit: 0.01
  five_day_lock_shortfall_unit: 0.01
  asymmetric_lock_unit: 0.01

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260825
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]
  include_prior_downside_raqm_paths: true

decision:
  compare_to_current_weighted_formal: true
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
