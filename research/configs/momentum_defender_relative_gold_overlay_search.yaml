experiment:
  id: momentum_defender_relative_gold_overlay_v1
  created_on: "2026-08-25"
  evidence_status: preregistered_retrospective_relative_overlay_search_not_oos
  hypothesis: >-
    Keep the selected universal 510300 gate frozen. Only while Gold is Momentum
    Top-1, permit Gold to bypass Defender when previous-close signed RAQM is
    positive and exceeds whole-Defender signed RAQM by a stable margin.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  momentum_assets: [510300.SH, 159915.SZ, 513100.SH, 518880.SH]
  universal_gate_config: research/configs/momentum_defender_downside_raqm_selected.yaml
  universal_gate_daily: experiments/20260824_momentum_defender_downside_raqm_final_selection/selected_daily.parquet
  gold_asset: 518880.SH
  defender: relative_defender_rotation_2013_listing_aware
  other_overlays: disabled

factor:
  formula: signed_regularized_raqm
  volatility_floor_annual: 0.08
  winsor_limit: 3.0
  timing: previous_close_to_next_open
  gold_health_threshold_fixed: 0.0
  profiles:
    w20: {horizons: [20], weights: [1.0]}
    w30: {horizons: [30], weights: [1.0]}
    w40: {horizons: [40], weights: [1.0]}
    w20_40_25_75: {horizons: [20, 40], weights: [0.25, 0.75]}
    w30_40_25_75: {horizons: [30, 40], weights: [0.25, 0.75]}

relative_overlay_grid:
  entry_differences: [0.0, 0.1, 0.2, 0.3, 0.4]
  exit_differences: [-0.2, -0.1, 0.0, 0.1]
  minimum_hysteresis_gap: 0.10
  entry_confirmation_days: [1, 3, 5]
  exit_confirmation_days: [1, 3]
  minimum_gold_hold_days: [0, 5, 10, 15, 20, 25, 30]
  locks_must_be_nonnegative_multiples_of_five: true
  override_modes: [gold_exemption_only, gold_bidirectional]

extreme_block_trim:
  shock_return_window: 5
  normalization_mode: raw_absolute_log_return
  block_length_sessions: 20
  excluded_block_fraction: 0.10
  candidate_independent: true
  final_metrics_include_all_dates: true

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]

selection_including_extremes:
  ranking_fields:
    - full_annualized_return_252
    - full_sharpe
    - full_minimum_segment_sharpe
    - neighborhood_full_annualized_q25
    - neighborhood_full_sharpe_q25
  occam_annualized_tolerance: 0.005
  occam_sharpe_tolerance: 0.02

selection_excluding_extremes:
  ranking_fields:
    - ordinary_annualized_return_252
    - ordinary_sharpe
    - ordinary_minimum_segment_sharpe
    - neighborhood_ordinary_annualized_q25
    - neighborhood_ordinary_sharpe_q25
  occam_annualized_tolerance: 0.005
  occam_sharpe_tolerance: 0.02

occam_complexity:
  single_window_profile: 0
  weighted_profile: 1
  gold_exemption_only: 0
  gold_bidirectional: 1
  confirmation_day_unit: 0.01
  hold_day_unit: 0.001

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260825
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]
  include_prior_gold_exception_paths_in_global_audit: true

decision:
  compare_to_frozen_universal_gate: true
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
