experiment:
  id: momentum_defender_selected_asset_draqm_focused_v2
  created_on: "2026-08-24"
  evidence_status: post_v1_boundary_and_lock_stability_search_not_oos
  predecessor: momentum_defender_selected_asset_draqm_v1
  requested_asset_note: >-
    510330 remains interpreted as the existing 510300.SH. V1 placed the best
    forced-two-asset candidate at the gold entry boundary and Defender hold 25;
    this separately versioned round resolves those neighborhoods.
  hypothesis: >-
    Finer entry thresholds, confirmation counts and 20-30 day Defender locks
    can reveal whether the apparent two-asset improvement is a stable plateau.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  momentum_window: 20
  momentum_convention: log_return
  efficiency_ratio_convention: log_price_path
  momentum_assets: [510300.SH, 159915.SZ, 513100.SH, 518880.SH]
  defender: relative_defender_rotation_2013_listing_aware
  gold_override: disabled
  emergency_override: disabled

factor:
  formula: downside_regularized_raqm
  volatility_floor_annual: 0.08
  winsor_limit: 3.0
  percentile_history: rolling_504_strict_lag
  percentile_min_history: 252
  assets:
    510300.SH:
      profiles:
        w35: {horizons: [35], weights: [1.0]}
        w40: {horizons: [40], weights: [1.0]}
        w30_40_25_75: {horizons: [30, 40], weights: [0.25, 0.75]}
    518880.SH:
      profiles:
        w20: {horizons: [20], weights: [1.0]}
        w30: {horizons: [30], weights: [1.0]}
        w40: {horizons: [40], weights: [1.0]}
        w60: {horizons: [60], weights: [1.0]}
        w20_40_25_75: {horizons: [20, 40], weights: [0.25, 0.75]}
        w20_40_equal: {horizons: [20, 40], weights: [0.50, 0.50]}
        w20_40_75_25: {horizons: [20, 40], weights: [0.75, 0.25]}
        w20_30_25_75: {horizons: [20, 30], weights: [0.25, 0.75]}

single_asset_stage:
  defender_entry_percentiles: [0.40, 0.45, 0.50, 0.55, 0.60, 0.70, 0.80]
  momentum_recovery_percentiles: [0.00, 0.05, 0.10, 0.20, 0.30, 0.40]
  minimum_hysteresis_gap: 0.15
  defender_entry_confirmation_days: [1, 2, 3, 4, 5]
  momentum_recovery_confirmation_days: [1, 2, 3]
  fixed_momentum_lock_days: 20
  fixed_defender_lock_days: 25
  fixed_recovery_reference: sticky_entry_asset
  minimum_defender_entries: 3
  minimum_defender_days: 40
  policies_per_asset_for_joint_stage: 12
  selection_rule: >-
    Retain profile-diverse policies using annualized return, Sharpe, minimum
    segment Sharpe and threshold/confirmation neighborhood q25 values.

joint_stage:
  include_disabled_policy_per_asset: true
  momentum_lock_days: [20, 25, 30]
  defender_lock_days: [20, 22, 24, 25, 26, 28, 30]
  recovery_reference_modes:
    - sticky_entry_asset
    - shadow_top1_recover_other
  minimum_defender_entries: 3
  minimum_defender_days: 60
  hard_full_annualized_return_floor: 0.45
  validation_annualized_return_floor: 0.25
  recent_annualized_return_floor: 0.25
  validation_sharpe_floor: 1.0
  recent_sharpe_floor: 1.0
  rank_rule: >-
    Require at least half of adjacent lock combinations to retain 45% full
    annualized return, then balance full annualized return, Sharpe, minimum
    segment Sharpe and both policy neighborhoods.

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]
  calendar_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260824
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  policies_for_other_momentum_assets_must_be_disabled: true
