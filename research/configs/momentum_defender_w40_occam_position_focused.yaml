experiment:
  id: momentum_defender_w40_occam_position_focused_v1
  created_on: "2026-08-25"
  evidence_status: focused_retrospective_followup_after_stage1_not_oos
  hypothesis: >-
    The stage-1 annualized/Sharpe conflict may be resolved by remaining fully
    invested in the selected dividend ETF except during a mechanically defined
    high-range, high-volatility, or positive-trend state.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  top_gate_strategy_id: momentum_defender_w40_loss_excluding_extremes_v1
  defender_selector: monthly_lowest_40_day_log_return

focused_position_families:
  references: [frozen_champion, fixed_w1.00]
  range_high_cut:
    signal_sources: [anchor, selected]
    windows: [20, 40, 60, 120]
    high_thresholds: [0.80, 0.90, 0.95]
    high_state_equity_weights: [0.00, 0.50, 0.75]
  volatility_high_cut:
    signal_sources: [anchor, selected]
    windows: [20]
    strict_lag_rolling_504_quantiles: [0.50, 0.80, 0.90, 0.95]
    high_state_equity_weights: [0.00, 0.50, 0.75]
  contrarian_trend:
    signal_sources: [anchor, selected]
    windows: [20, 40, 60, 120]
    positive_trend_equity_weights: [0.00, 0.50, 0.75]

extreme_block_trim:
  shock_assets: [510300.SH, 518880.SH]
  shock_return_window: 5
  block_length_sessions: 20
  excluded_block_fraction: 0.10
  normalization_mode: raw_absolute_log_return

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]

eligibility:
  maximum_full_drawdown: -0.30
  minimum_full_segment_sharpe: 1.20
  minimum_ordinary_segment_sharpe: 1.35

joint_occam_selection:
  full_annualized_tolerance: 0.01
  full_sharpe_tolerance: 0.03
  ordinary_annualized_tolerance: 0.01
  ordinary_sharpe_tolerance: 0.05

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260825
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  latest_w40_gate_parameters_must_not_be_refit: true

