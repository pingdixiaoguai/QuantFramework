experiment:
  id: momentum_defender_log_qm_multihorizon_ensemble_v3
  created_on: "2026-08-24"
  evidence_status: second_round_retrospective_robust_search_not_oos
  predecessor: momentum_defender_log_qm_robust_mechanism_search_v2
  mechanism_reason: >-
    Single-window gates showed a stable return-risk trade-off but no joint
    improvement. This round uses equal-weight multi-horizon votes and relative
    Momentum-versus-Defender trend to reduce window and threshold dependence.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  gold_override: risk_adjusted_quality_momentum_w5_entry_2.20_exit_0.60_hard_hold_5
  defender: relative_defender_rotation_2013_listing_aware

periods:
  full: ["2019-01-18", "2026-08-21"]
  calendar_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

ensemble_gate_stage:
  modes: [trend_vote, relative_vote, combined_vote]
  horizon_sets:
    - [20, 60, 120]
    - [20, 40, 120]
    - [40, 60, 120]
  vote_fractions: [0.40, 0.50, 0.60, 0.70]
  relative_thresholds: [-0.025, 0.0, 0.025]
  state_policies:
    symmetric_10: {min_momentum_days: 10, min_defender_days: 10, risk_off_confirmation: 1, risk_on_confirmation: 1}
    symmetric_20: {min_momentum_days: 20, min_defender_days: 20, risk_off_confirmation: 1, risk_on_confirmation: 1}
    momentum_40_defender_20: {min_momentum_days: 40, min_defender_days: 20, risk_off_confirmation: 1, risk_on_confirmation: 1}
    momentum_20_defender_40: {min_momentum_days: 20, min_defender_days: 40, risk_off_confirmation: 1, risk_on_confirmation: 1}
    off_confirm_3: {min_momentum_days: 20, min_defender_days: 20, risk_off_confirmation: 3, risk_on_confirmation: 1}
    confirm_3_3: {min_momentum_days: 20, min_defender_days: 20, risk_off_confirmation: 3, risk_on_confirmation: 3}
    momentum_40_off_confirm_3: {min_momentum_days: 40, min_defender_days: 20, risk_off_confirmation: 3, risk_on_confirmation: 1}
    defender_40_off_confirm_3: {min_momentum_days: 20, min_defender_days: 40, risk_off_confirmation: 3, risk_on_confirmation: 1}
  top_robust_gates_for_emergency_stage: 12

emergency_stage:
  include_none: true
  one_day_loss_thresholds: [-0.02, -0.04, -0.06]
  drawdown_windows: [10, 20, 40]
  drawdown_thresholds: [-0.05, -0.08, -0.12]
  volatility_windows: [5, 10, 20]
  common_quantiles: [0.80, 0.90, 0.95]
  quantile_histories: [expanding_strict_lag, rolling_504_strict_lag]
  negative_trend_confirmation_window: 5
  quantile_min_history: 20
  rolling_history: 504

robust_selection:
  selection_data: all_history_with_leave_one_year_influence_stress
  annualized_delta_q25_floor: -0.03
  annualized_delta_median_floor: 0.0
  sharpe_delta_q25_floor: -0.10
  sharpe_delta_median_floor: 0.0
  require_full_mdd_nonworsening: true
  require_full_three_metric_dominance_for_promotion: true
  note: >-
    Leave-one-year MDD deltas are not a hard gate because deleting a year can
    relocate the single maximum-drawdown episode discontinuously. Full-history
    MDD and leave-event MDD remain mandatory.

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260824
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  deleted_periods_are_stress_tests_only: true
  final_performance_always_uses_all_dates: true
