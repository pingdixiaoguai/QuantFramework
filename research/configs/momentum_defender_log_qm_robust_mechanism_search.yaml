experiment:
  id: momentum_defender_log_qm_robust_mechanism_search_v2
  created_on: "2026-08-24"
  evidence_status: retrospective_robust_cross_regime_search_not_oos
  baseline_strategy: momentum_defender_c2_gold_raqm_w5_log_qm_v2
  hypothesis: >-
    Cross-asset trend state, asymmetric locks, confirmation, and directional
    emergency controls can improve the full annualized-return, Sharpe, and MDD
    trade-off more robustly than a single CSI300 gate plus directionless
    volatility caps.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  momentum_window: 20
  momentum_convention: log_return
  efficiency_ratio_convention: log_price_path
  gold_override: risk_adjusted_quality_momentum_w5_entry_2.20_exit_0.60_hard_hold_5
  defender: relative_defender_rotation_2013_listing_aware
  searchable: [regime_gate, state_policy, emergency]

periods:
  full: ["2019-01-18", "2026-08-21"]
  calendar_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

gate_stage:
  log_return_lookbacks: [20, 40, 60, 120]
  return_thresholds: [-0.05, 0.0, 0.025, 0.05, 0.10]
  return_gate_modes: [anchor, held, anchor_or_held, anchor_and_held]
  breadth_required: [1, 2, 3, 4]
  breadth_gate_modes: [breadth, anchor_or_breadth, held_or_breadth]
  state_policies:
    symmetric_10:
      min_momentum_days: 10
      min_defender_days: 10
      risk_off_confirmation: 1
      risk_on_confirmation: 1
    symmetric_20:
      min_momentum_days: 20
      min_defender_days: 20
      risk_off_confirmation: 1
      risk_on_confirmation: 1
    momentum_40_defender_20:
      min_momentum_days: 40
      min_defender_days: 20
      risk_off_confirmation: 1
      risk_on_confirmation: 1
    momentum_20_defender_40:
      min_momentum_days: 20
      min_defender_days: 40
      risk_off_confirmation: 1
      risk_on_confirmation: 1
    off_confirm_3:
      min_momentum_days: 20
      min_defender_days: 20
      risk_off_confirmation: 3
      risk_on_confirmation: 1
    confirm_3_3:
      min_momentum_days: 20
      min_defender_days: 20
      risk_off_confirmation: 3
      risk_on_confirmation: 3
    momentum_40_off_confirm_3:
      min_momentum_days: 40
      min_defender_days: 20
      risk_off_confirmation: 3
      risk_on_confirmation: 1
    defender_40_off_confirm_3:
      min_momentum_days: 20
      min_defender_days: 40
      risk_off_confirmation: 3
      risk_on_confirmation: 1
  top_robust_gates_for_emergency_stage: 12

emergency_stage:
  include_none: true
  one_day_loss_thresholds: [-0.02, -0.04, -0.06]
  drawdown_windows: [10, 20, 40]
  drawdown_thresholds: [-0.05, -0.08, -0.12]
  volatility_windows: [5, 10, 20]
  common_quantiles: [0.80, 0.90, 0.95]
  quantile_histories: [expanding_strict_lag, rolling_504_strict_lag]
  negative_trend_confirmation_window: 5
  quantile_min_history: 20
  rolling_history: 504

robust_selection:
  selection_data: all_history_with_leave_one_year_influence_stress
  disclaimer: retrospective_robust_selection_not_independent_oos
  minimum_defender_entries: 3
  minimum_defender_days: 60
  require_full_sample_three_metric_dominance_for_promotion: true
  annualized_delta_q25_floor: -0.03
  annualized_delta_median_floor: 0.0
  sharpe_delta_q25_floor: -0.10
  sharpe_delta_median_floor: 0.0
  mdd_delta_worst_floor: -0.02
  score_rule: maximize_minimum_robust_metric_percentile_then_mean

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260824
  event_leave_out: true
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  final_performance_always_uses_all_dates: true
  deleted_periods_are_stress_tests_only: true
