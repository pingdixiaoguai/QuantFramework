experiment:
  id: momentum_defender_occam_defender_reversal_v1
  created_on: "2026-08-25"
  evidence_status: retrospective_followup_after_exploratory_ablation_not_oos
  hypothesis: >-
    The formal Defender monthly selector can be reduced to one trailing-return
    reversal rule while retaining its frozen core exposure schedule. Re-fitting
    only the top-level state parameters may recover most or all composite
    performance without reintroducing asset-selection branches.

frozen_layers:
  momentum_factor: quality_momentum
  momentum_factor_version: "2.0.0"
  momentum_window: 20
  defender_core: relative_defender_champion_frozen
  defender_asset_pool:
    - 512890.SH
    - 159545.SZ
    - 513530.SH
    - 515080.SH
    - 510880.SH
    - 563020.SH
  defender_residual_asset: 511260.SH
  gold_override: disabled
  emergency_override: disabled

defender_selector:
  frequency: monthly
  score: trailing_log_return
  direction: lowest
  windows: [10, 20, 30, 40, 50, 60]
  selected_asset_weight: frozen_core_primary_target
  residual_weight: 511260.SH
  unavailable_switch: retain_previous_asset

regime_factor:
  anchor_asset: 510300.SH
  formula: downside_regularized_raqm
  horizons: [30, 40]
  weights: [0.25, 0.75]
  volatility_floor_annual: 0.08
  winsor_limit: 3.0
  percentile_history: rolling_504_strict_lag
  percentile_min_history: 252

state_grid:
  entry_percentiles: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  recovery_percentiles: [0.10, 0.20, 0.30, 0.40]
  minimum_hysteresis_gap: 0.10
  entry_confirmation_days: [1, 3, 5]
  recovery_confirmation_days: [1, 3]
  momentum_lock_days: [20, 25, 30]
  defender_lock_days: [20, 25, 30]

extreme_block_trim:
  shock_assets: [510300.SH, 518880.SH]
  shock_return_window: 5
  block_length_sessions: 20
  excluded_block_fraction: 0.10
  normalization_mode: raw_absolute_log_return

periods:
  development: ["2019-01-18", "2022-12-30"]
  validation: ["2023-01-01", "2024-12-31"]
  recent: ["2025-01-01", "2026-08-21"]
  full: ["2019-01-18", "2026-08-21"]

eligibility:
  minimum_defender_entries: 3
  minimum_defender_days: 60
  maximum_full_drawdown: -0.30
  minimum_full_segment_sharpe: 1.25
  minimum_ordinary_segment_sharpe: 1.40

selection_full_sample:
  ranking_fields:
    - full_annualized_return_252
    - full_sharpe
    - full_minimum_segment_sharpe
    - neighborhood_full_annualized_q25
    - neighborhood_full_sharpe_q25
    - ordinary_annualized_return_252
    - ordinary_sharpe
  occam_annualized_tolerance: 0.01
  occam_sharpe_tolerance: 0.03

selection_excluding_extremes:
  ranking_fields:
    - ordinary_annualized_return_252
    - ordinary_sharpe
    - ordinary_minimum_segment_sharpe
    - neighborhood_ordinary_annualized_q25
    - neighborhood_ordinary_sharpe_q25
    - full_annualized_return_252
    - full_sharpe
  occam_annualized_tolerance: 0.01
  occam_sharpe_tolerance: 0.03

overfit_checks:
  cscv_blocks: 12
  paired_block_bootstrap_block: 20
  paired_block_bootstrap_repetitions: 5000
  yearly_reality_check_repetitions: 5000
  random_seed: 20260825
  top_positive_event_deletions: [1, 2, 3]
  friction_cost_multipliers: [1.0, 2.0, 3.0]

decision:
  no_automatic_production_replacement: true
  require_explicit_user_promotion: true
  prefer_simpler_defender_only_if_robust_tradeoff_is_acceptable: true

