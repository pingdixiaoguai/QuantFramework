experiment:
  id: momentum_defender_defender_range_escape_2019_v1
  created_on: "2026-08-27"
  evidence_status: retrospective_occam_range_escape_audit_not_independent_oos
  evaluation_start: "2019-01-18"
  evidence_cutoff: "2026-08-26"
  baseline_strategy_id: momentum_defender_w40_qm40_threshold_v5
  hypothesis: >-
    When the Defender anchor is near the top of its trailing range, moving a
    small part of the formal Defender allocation into the already-frozen
    Momentum Top-1 may improve annualized return and Sharpe without changing
    any formal v5 state, selector, factor, or Gold parameter.

frozen_layers:
  formal_strategy: momentum_defender_w40_qm40_threshold_v5
  momentum_top1: formal_v5_schedule
  defender_selector: monthly_lowest_qm40
  w40_gate: frozen_formal_v5
  qm40_recovery_threshold: 0.0075
  gold_escape: frozen_formal_v5
  execution_timing: previous_close_to_next_open
  equity_etf_one_way_cost: 0.0001

