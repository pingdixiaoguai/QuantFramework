  search_script: research/three_factor_trend_search.py
  train_end: "2022-09-02"
  selection_rule: train_only_plateau_representative
asset_pool:
  - 510300.SH   # 沪深300 ETF
  - 159915.SZ   # 创业板 ETF
  - 513100.SH   # 纳斯达克 ETF
  - 518880.SH   # 黄金 ETF
